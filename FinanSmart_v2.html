<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinanSmart — Control Financiero Personal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0D1117;--bg2:#161B22;--bg3:#1C2128;--bg4:#22272E;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#CDD9E5;--text2:#8B949E;--text3:#4D5566;
  --accent:#2DA44E;--accent2:#3FB950;--accent-dim:rgba(45,164,78,0.12);
  --blue:#388BFD;--blue-dim:rgba(56,139,253,0.12);
  --amber:#D29922;--amber-dim:rgba(210,153,34,0.12);
  --red:#F85149;--red-dim:rgba(248,81,73,0.12);
  --purple:#BC8CFF;--purple-dim:rgba(188,140,255,0.12);
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:8px;--r2:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:56px 220px 1fr;height:100vh;overflow:hidden}

/* RAIL */
.rail{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px}
.rail-logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;flex-shrink:0}
.rail-logo svg{width:18px;height:18px;fill:#fff}
.ri{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);transition:all .15s;position:relative}
.ri:hover{background:var(--bg3);color:var(--text2)}
.ri.active{background:var(--accent-dim);color:var(--accent2)}
.ri svg{width:17px;height:17px}
.ri .tip{position:absolute;left:44px;background:var(--bg4);border:1px solid var(--border2);color:var(--text);font-size:12px;padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:99}
.ri:hover .tip{opacity:1}
.rail-sep{width:24px;height:1px;background:var(--border);margin:6px 0}

/* SIDEBAR */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:16px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-head h2{font-size:13px;font-weight:700;color:var(--text)}
.sb-head p{font-size:11px;color:var(--text3);margin-top:2px}
.sb-body{flex:1;overflow-y:auto;padding:4px 0}
.sb-body::-webkit-scrollbar{width:3px}
.sb-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.ng{padding:10px 12px 4px;font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.09em}
.ni{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:6px;cursor:pointer;color:var(--text2);font-size:12px;transition:all .12s;margin:1px 4px}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni.active{background:var(--accent-dim);color:var(--accent2);font-weight:500}
.ni svg{width:14px;height:14px;flex-shrink:0;opacity:.7}
.ni.active svg{opacity:1}
.nbadge{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600}
.nb-g{background:var(--accent-dim);color:var(--accent2)}
.nb-b{background:var(--blue-dim);color:var(--blue)}
.nb-a{background:var(--amber-dim);color:var(--amber)}
.nb-r{background:var(--red-dim);color:var(--red)}
.sb-foot{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.user-chip{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer}
.user-chip:hover{background:var(--bg3)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.uname{font-size:12px;font-weight:600;color:var(--text)}
.uplan{font-size:10px;color:var(--text3)}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.tbcrumb{display:flex;align-items:center;gap:8px;font-size:13px}
.tbcrumb span{color:var(--text3)}
.tbcrumb strong{color:var(--text);font-weight:500}
.tbrright{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:var(--font);transition:all .12s}
.btn:hover{border-color:var(--border2);color:var(--text)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:#289440}
.btn svg{width:13px;height:13px}
.content{flex:1;overflow-y:auto;padding:22px 24px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* PANELS */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:18px 20px;margin-bottom:14px}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ptitle{font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px}
.ptitle::before{content:'';display:block;width:3px;height:13px;border-radius:2px;background:var(--accent)}
.paction{font-size:11px;color:var(--blue);cursor:pointer;opacity:.8}
.paction:hover{opacity:1}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:14px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--border2)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.cg::before{background:var(--accent)}
.kpi.cb::before{background:var(--blue)}
.kpi.ca::before{background:var(--amber)}
.kpi.cr::before{background:var(--red)}
.kpi.cp::before{background:var(--purple)}
.klabel{font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.kvalue{font-size:22px;font-weight:700;color:var(--text);font-family:var(--mono);letter-spacing:-.02em}
.kdelta{font-size:11px;margin-top:5px}
.kdelta.up{color:var(--accent2)} .kdelta.dn{color:var(--red)} .kdelta.fl{color:var(--text3)}

/* ROWS */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.row32{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:14px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text2)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg3);color:var(--text)}
.tbl .tbold{font-weight:600;color:var(--text);font-family:var(--mono)}
.tbl .tg{color:var(--accent2)!important;font-weight:600}
.tbl .tr{color:var(--red)!important;font-weight:600}
.tbl .ta{color:var(--amber)!important;font-weight:600}

/* ALERT */
.alert{display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:12px}
.aw{background:var(--amber-dim);border:1px solid rgba(210,153,34,.2);color:var(--amber)}
.ai{background:var(--blue-dim);border:1px solid rgba(56,139,253,.2);color:var(--blue)}
.as{background:var(--accent-dim);border:1px solid rgba(45,164,78,.2);color:var(--accent2)}
.ar{background:var(--red-dim);border:1px solid rgba(248,81,73,.2);color:var(--red)}
.alert svg{width:14px;height:14px;flex-shrink:0}

/* BARS CHART */
.chart-area{height:110px;display:flex;align-items:flex-end;gap:5px}
.bar-group{display:flex;gap:2px;align-items:flex-end;flex:1}
.bar{border-radius:3px 3px 0 0;min-height:3px;transition:opacity .15s;cursor:pointer}
.bar:hover{opacity:.75}
.bi{background:var(--accent)} .be{background:var(--red)} .ba{background:var(--blue)}
.chart-labels{display:flex;gap:5px;margin-top:5px}
.chart-label{flex:1;font-size:9px;text-align:center;color:var(--text3)}
.legend{display:flex;gap:12px;margin-top:8px}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3)}
.ld{width:8px;height:8px;border-radius:2px}

/* PROGRESS */
.pt{width:100%;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:4px}
.pf{height:100%;border-radius:3px;transition:width .5s}

/* BADGE */
.sem{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px}
.sg{background:var(--accent-dim);color:var(--accent2)}
.sa{background:var(--amber-dim);color:var(--amber)}
.sr{background:var(--red-dim);color:var(--red)}
.sb2{background:var(--blue-dim);color:var(--blue)}

/* FORM */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.field label{font-size:11px;color:var(--text3);display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.field select option{background:var(--bg3)}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}

/* AI ZONE */
.ai-input-wrap{position:relative}
.ai-textarea{width:100%;min-height:80px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;font-size:14px;color:var(--text);font-family:var(--font);resize:none;outline:none;line-height:1.6;transition:border-color .15s}
.ai-textarea:focus{border-color:var(--blue)}
.ai-textarea::placeholder{color:var(--text3)}
.ai-btn-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--text3);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--border2);color:var(--text)}

/* AI RESULT */
.ai-result{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:16px;margin-top:12px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.ai-result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.air-item{background:var(--bg2);border-radius:7px;padding:10px 12px}
.air-label{font-size:10px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.air-value{font-size:13px;font-weight:600;color:var(--text)}
.air-conf{font-size:10px;color:var(--text3);margin-top:3px}
.ai-confirm-row{display:flex;gap:8px;margin-top:10px}
.ai-nota{font-size:11px;color:var(--text2);margin-top:8px;line-height:1.5;padding:8px;background:var(--bg2);border-radius:6px;border-left:2px solid var(--blue)}
.thinking{display:flex;align-items:center;gap:10px;padding:14px;background:var(--bg3);border-radius:8px;font-size:12px;color:var(--text3)}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:24px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:15px;font-weight:700;color:var(--text)}
.modal-close{width:28px;height:28px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;transition:all .12s}
.modal-close:hover{color:var(--text);border-color:var(--border2)}
.modal-footer{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

/* CALC TABS */
.ctabs{display:flex;gap:3px;background:var(--bg3);border-radius:8px;padding:3px;margin-bottom:14px;flex-wrap:wrap}
.ctab{padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;color:var(--text3);transition:all .12s;white-space:nowrap}
.ctab.active{background:var(--bg2);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ctab:hover:not(.active){color:var(--text2)}

/* RESULT */
.rbox{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px}
.rhigh{background:linear-gradient(135deg,rgba(45,164,78,.08),rgba(56,139,253,.06));border:1px solid rgba(45,164,78,.2);border-radius:8px;padding:14px;margin-top:12px}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.rrow:last-child{border-bottom:none}
.rl{font-size:12px;color:var(--text3)}
.rv{font-size:12px;font-weight:600;color:var(--text);font-family:var(--mono)}
.rv.big{font-size:18px;color:var(--accent2)}

/* TAGS */
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:11px;color:var(--text2);margin:3px;cursor:pointer;transition:all .12s}
.tag:hover{border-color:var(--border2);color:var(--text)}
.tag-a{background:var(--accent-dim);border-color:rgba(45,164,78,.3);color:var(--accent2)}

/* GOAL */
.goal{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg4);border:1px solid var(--border2);border-radius:10px;padding:14px 18px;font-size:13px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:fadeIn .2s ease;display:flex;align-items:center;gap:10px;max-width:360px}
.toast.toast-s{border-left:3px solid var(--accent2);color:var(--accent2)}
.toast.toast-e{border-left:3px solid var(--red);color:var(--red)}
.toast.toast-i{border-left:3px solid var(--blue);color:var(--blue)}

/* MISC */
.divider{height:1px;background:var(--border);margin:14px 0}
.stitle{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;margin-top:4px}

@media (max-width: 768px) {
  .app { grid-template-columns: 56px 1fr; }
  .sidebar { display: none; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .row2, .row32 { grid-template-columns: 1fr; }
  .frow, .frow3 { grid-template-columns: 1fr; }
  .content { padding: 14px; }
  .topbar { padding: 0 14px; }
  .tbrright .btn span { display: none; }
}
</style>
</head>
<body>
<div class="app">

<!-- RAIL -->
<div class="rail">
  <div class="rail-logo"><svg viewBox="0 0 20 20"><path d="M3 14h3v3H3v-3zm4-4h3v7H7v-7zm4-4h3v11h-3V6zm4-3h3v14h-3V3z"/></svg></div>

    <span class="tip">Presupuesto</span>

  <div class="ri" onclick="nav('metas',this)">
    <svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="10" r="1.5"/></svg>
    <span class="tip">Metas</span>
  </div>
  <div class="rail-sep"></div>
  <div class="ri" onclick="nav('setup',this)">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a1 1 0 00-1 1v.172A6.977 6.977 0 007 4.238l-.707-.707a1 1 0 00-1.414 1.414l.707.707A6.977 6.977 0 004.172 9H4a1 1 0 000 2h.172A6.977 6.977 0 005.586 13.414l-.707.707a1 1 0 101.414 1.414l.707-.707A6.977 6.977 0 009 15.828V16a1 1 0 102 0v-.172a6.977 6.977 0 002.414-1.414l.707.707a1 1 0 001.414-1.414l-.707-.707A6.977 6.977 0 0015.828 11H16a1 1 0 000-2h-.172a6.977 6.977 0 00-1.414-2.586l.707-.707a1 1 0 00-1.414-1.414l-.707.707A6.977 6.977 0 0011 3.172V3a1 1 0 00-1-1zm0 5a3 3 0 110 6 3 3 0 010-6z"/></svg>
    <span class="tip">Configuración</span>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sb-head"><h2>FinanSmart</h2><p>Control · Proyección · Simulación</p></div>
  <div class="sb-body" id="sb-nav"></div>
  <div class="sb-foot">
    <div class="user-chip">
      <div class="avatar">YB</div>
      <div><div class="uname">Yeti BI</div><div class="uplan">MVP v2.0 — 2026</div></div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="tbcrumb">
      <span>FinanSmart</span><span>›</span>
      <strong id="tb-title">Dashboard</strong>

function loadState() {
  try {
    const b = localStorage.getItem('fs_budget');
    const t = localStorage.getItem('fs_transactions');
    const m = localStorage.getItem('fs_metas');
    return {
      budget: b ? JSON.parse(b) : DEFAULT_BUDGET,
      transactions: t ? JSON.parse(t) : [],
      metas: m ? JSON.parse(m) : DEFAULT_METAS,
      nextId: parseInt(localStorage.getItem('fs_nextid')||'100'),
    };
  } catch(e) { return {budget:DEFAULT_BUDGET,transactions:[],metas:DEFAULT_METAS,nextId:100}; }
}
function saveState() {
  localStorage.setItem('fs_budget', JSON.stringify(S.budget));
  localStorage.setItem('fs_transactions', JSON.stringify(S.transactions));
  localStorage.setItem('fs_metas', JSON.stringify(S.metas));
  localStorage.setItem('fs_nextid', String(S.nextId));
}
let S = loadState();

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
const cop = n => isNaN(n)||!isFinite(n)?'—':'$'+new Intl.NumberFormat('es-CO').format(Math.round(n));
const M = n => (n/1e6).toFixed(1)+'M';
const pct = (n,d=1) => isNaN(n)?'—':(n*100).toFixed(d)+'%';
const today = () => new Date().toISOString().split('T')[0];

function toast(msg, type='s') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.innerHTML = `<span>${msg}</span>`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════

  cog:`<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a1 1 0 00-1 1v.172A6.977 6.977 0 007 4.238l-.707-.707a1 1 0 00-1.414 1.414l.707.707A6.977 6.977 0 004.172 9H4a1 1 0 000 2h.172A6.977 6.977 0 005.586 13.414l-.707.707a1 1 0 101.414 1.414l.707-.707A6.977 6.977 0 009 15.828V16a1 1 0 102 0v-.172a6.977 6.977 0 002.414-1.414l.707.707a1 1 0 001.414-1.414l-.707-.707A6.977 6.977 0 0015.828 11H16a1 1 0 000-2h-.172a6.977 6.977 0 00-1.414-2.586l.707-.707a1 1 0 00-1.414-1.414l-.707.707A6.977 6.977 0 0011 3.172V3a1 1 0 00-1-1zm0 5a3 3 0 110 6 3 3 0 010-6z"/></svg>`,
};

let currentPage = 'dashboard';

function buildNav() {
  const el = document.getElementById('sb-nav');
  let h = '';
  navConfig.forEach(g => {
    h += `<div class="ng">${g.group}</div>`;
    g.items.forEach(item => {
      const active = item.id === currentPage ? 'active' : '';
      const badge = item.badge ? `<span class="nbadge ${item.badge.c}">${item.badge.t}</span>` : '';
      h += `<div class="ni ${active}" onclick="nav('${item.id}',null)">${svgs[item.icon]||''}${item.label}${badge}</div>`;
    });
  });
  el.innerHTML = h;
}

function nav(id, railBtn) {
  currentPage = id;
  buildNav();
  if(railBtn) {
    document.querySelectorAll('.ri').forEach(r=>r.classList.remove('active'));
    railBtn.classList.add('active');
  }
  const titles = {dashboard:'Dashboard',ia:'Clasificador Inteligente',presupuesto:'Presupuesto Anual',
    registro:'Registro de Movimientos',monitoreo:'Monitoreo y Control',metas:'Metas Financieras',
    calculadora:'Calculadoras',setup:'SetUp Dimensiones'};
  document.getElementById('tb-title').textContent = titles[id]||id;

    calculadora:renderCalculadora,setup:renderSetup};
  document.getElementById('main-content').innerHTML = '';
  if(renders[id]) renders[id]();
}

function openModal(id) {
  document.getElementById(`modal-${id}`).classList.remove('hidden');
  if(id==='new-tx') document.getElementById('ntx-fecha').value = today();
}
function closeModal(id) {
  document.getElementById(`modal-${id}`).classList.add('hidden');
}

// ═══════════════════════════════════════════════════════════
//  SAVE FUNCTIONS (fully working)
// ═══════════════════════════════════════════════════════════
function saveTransaction() {
  const tipo = document.getElementById('ntx-tipo').value;
  const fecha = document.getElementById('ntx-fecha').value;
  const cat = document.getElementById('ntx-cat').value;
  const sub = document.getElementById('ntx-sub').value;
  const monto = parseFloat(document.getElementById('ntx-monto').value)||0;
  const metodo = document.getElementById('ntx-metodo').value;
  const clase = document.getElementById('ntx-clase').value;
  const notas = document.getElementById('ntx-notas').value;
  if(!monto || !fecha) { toast('Completa fecha y monto', 'e'); return; }
  S.transactions.push({id:S.nextId++,tipo,fecha,cat,sub,monto,metodo,clase,notas});
  saveState();
  closeModal('new-tx');
  toast(`✓ Transacción guardada — ${cop(monto)}`);
  if(currentPage==='registro') renderRegistro();
  if(currentPage==='dashboard') renderDashboard();
}

function saveBudgetItem() {
  const tipo = document.getElementById('bi-tipo').value;
  const cat = document.getElementById('bi-cat').value;
  const nombre = document.getElementById('bi-nombre').value.trim();
  const monto = parseFloat(document.getElementById('bi-monto').value)||0;
  const freq = document.getElementById('bi-freq').value;
  const clase = document.getElementById('bi-clase').value;
  if(!nombre || !monto) { toast('Completa nombre y monto', 'e'); return; }
  S.budget.push({id:S.nextId++,tipo,cat,nombre,monto,freq,clase});
  saveState();
  closeModal('add-item');
  toast(`✓ Ítem "${nombre}" agregado al presupuesto`);
  renderPresupuesto();
}

function deleteBudgetItem(id) {
  S.budget = S.budget.filter(b=>b.id!==id);
  saveState();
  renderPresupuesto();
  toast('Ítem eliminado','i');
}

function saveMeta() {
  const nombre = document.getElementById('m-nombre').value.trim();
  const cat = document.getElementById('m-cat').value;
  const total = parseFloat(document.getElementById('m-total').value)||0;
  const actual = parseFloat(document.getElementById('m-actual').value)||0;
  const aporte = parseFloat(document.getElementById('m-aporte').value)||0;
  const plazo = document.getElementById('m-plazo').value;
  if(!nombre || !total) { toast('Completa nombre y meta total','e'); return; }
  S.metas.push({id:S.nextId++,nombre,cat,total,actual,aporte,plazo});
  saveState();
  closeModal('add-meta');
  toast(`✓ Meta "${nombre}" creada`);
  renderMetas();
}

function deleteMeta(id) {
  S.metas = S.metas.filter(m=>m.id!==id);
  saveState();
  renderMetas();
  toast('Meta eliminada','i');
}

function deleteTransaction(id) {
  S.transactions = S.transactions.filter(t=>t.id!==id);
  saveState();
  renderRegistro();
  toast('Transacción eliminada','i');
}

async function clasificarIA() {
  const texto = document.getElementById('ai-input').value.trim();
  if(!texto) { toast('Escribe una descripción primero','e'); return; }

  const zone = document.getElementById('ai-result-zone');
  zone.innerHTML = `<div class="thinking"><div class="spinner"></div><span>Analizando "${texto}"...</span></div>`;

  const prompt = `Eres un experto en finanzas personales colombianas. Clasifica este movimiento financiero descrito en lenguaje natural.

Descripción del usuario: "${texto}"

Responde ÚNICAMENTE con un JSON con esta estructura exacta (sin backticks, sin markdown, solo JSON puro):
{
  "tipo": "Egreso" o "Ingreso",
  "categoria": una de estas exactas: "Hogar", "Alimentación", "Transporte", "Salud", "Entretenimiento", "Educación", "Familia", "Créditos o Deudas", "Salario", "Primas", "Bonos", "Otros",
  "subcategoria": subcategoría específica (ej: "Arriendo", "Netflix", "Gasolina", "Mercado", "Cine", etc.),
  "clase": "Fijo" o "Variable",
  "confianza": número del 0 al 100 indicando qué tan seguro estás,
  "explicacion": una frase corta explicando por qué clasificaste así (máx 15 palabras),
  "monto_sugerido": 0
}`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 400,
        messages: [{role:'user', content: prompt}]
      })
    });

    const data = await resp.json();
    const raw = data.content?.[0]?.text || '';
    let result;
    try {
      const clean = raw.replace(/```json|```/g,'').trim();
      result = JSON.parse(clean);
    } catch(e) {
      throw new Error('No pude parsear la respuesta de la IA');
    }

    const confColor = result.confianza >= 85 ? 'var(--accent2)' : result.confianza >= 60 ? 'var(--amber)' : 'var(--red)';

    window.lastAIResult = result;
    zone.innerHTML = `
    <div class="ai-result">
      <div class="ai-result-grid">
        <div class="air-item">
          <div class="air-label">Tipo</div>
          <div class="air-value"><span class="sem ${result.tipo==='Ingreso'?'sg':'sr'}">${result.tipo}</span></div>
        </div>
        <div class="air-item">
          <div class="air-label">Categoría</div>
          <div class="air-value">${result.categoria}</div>
          <div class="air-conf" style="color:var(--text3)">${result.subcategoria}</div>
        </div>
        <div class="air-item">
          <div class="air-label">Clase · Confianza</div>
          <div class="air-value">${result.clase}</div>
          <div class="air-conf" style="color:${confColor};font-weight:600">${result.confianza}% confianza</div>
        </div>
      </div>
      <div class="ai-nota">💡 ${result.explicacion}</div>
      <div style="margin-top:12px" class="frow">
        <div class="field"><label>Monto ($)</label><input type="number" id="ia-monto" placeholder="Ingresa el monto" min="0"></div>
        <div class="field"><label>Fecha</label><input type="date" id="ia-fecha" value="${today()}"></div>
      </div>
      <div class="ai-confirm-row">
        <button class="btn btn-p" onclick="confirmarClasificacion()">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>
          Confirmar y guardar
        </button>
        <button class="btn" onclick="document.getElementById('ai-result-zone').innerHTML=''">Descartar</button>
      </div>
    </div>`;

  } catch(err) {
    zone.innerHTML = `<div class="alert ar"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"/></svg><span>Error al clasificar. Verifica tu conexión e inténtalo de nuevo. (${err.message})</span></div>`;
  }
}

function confirmarClasificacion() {
  const result = window.lastAIResult;
  if (!result) { toast('Error: no hay resultado de clasificación','e'); return; }
  const monto = parseFloat(document.getElementById('ia-monto').value)||0;
  const fecha = document.getElementById('ia-fecha').value || today();
  if(!monto) { toast('Ingresa el monto','e'); return; }
  const desc = document.getElementById('ai-input').value.trim();
  S.transactions.push({
    id: S.nextId++,
    tipo: result.tipo,
    fecha,
    cat: result.categoria,
    sub: result.subcategoria,
    monto,
    metodo: 'Sin especificar',
    clase: result.clase,
    notas: desc
  });
  saveState();
  document.getElementById('ai-input').value = '';
  document.getElementById('ai-result-zone').innerHTML = '';
  toast(`✓ ${result.tipo} de ${cop(monto)} guardado en ${result.categoria}`);
  renderIA();
}

function renderMonitoreo() {
  const c = document.getElementById('main-content');
  const cats = ['Hogar','Alimentación','Transporte','Salud','Entretenimiento','Créditos o Deudas'];
  const ppto = {Hogar:2525000,Alimentación:950000,Transporte:320000,Salud:300000,Entretenimiento:590000,'Créditos o Deudas':450000};

  // Compute real from transactions
  const real = {};
  S.transactions.filter(t=>t.tipo==='Egreso').forEach(t=>{
    real[t.cat] = (real[t.cat]||0)+t.monto;
  });

  c.innerHTML = `
  <div class="kpi-grid">
    <div class="kpi cg"><div class="klabel">Presupuesto Total Gastos</div><div class="kvalue" style="font-size:18px">${cop(Object.values(ppto).reduce((a,b)=>a+b,0))}</div></div>

    <div class="kpi ca"><div class="klabel">Alertas activas</div><div class="kvalue">${cats.filter(c=>((real[c]||0)/ppto[c])>1).length}</div></div>
  </div>
  <div class="panel">
    <div class="panel-header"><span class="ptitle">Ejecución vs Presupuesto por Categoría</span></div>
    <div style="display:flex;flex-direction:column;gap:14px">
    ${cats.map(cat=>{
      const r=real[cat]||0, p=ppto[cat]||1;
      const ejec=r/p;
      const cl=ejec>1?'var(--red)':ejec>0.85?'var(--amber)':'var(--accent)';
      const semCls=ejec>1?'sr':ejec>0.85?'sa':'sg';
      return `<div>
        <div style="display:flex;justify-content:space-between;margin-bottom:5px;align-items:center">

          <div style="display:flex;align-items:center;gap:10px">

            <span class="sem ${semCls}">${pct(ejec)} ${ejec>1?'⚠':ejec>0.85?'~':'✓'}</span>
          </div>
        </div>
        <div class="pt">
          <div class="pf" style="width:${Math.min(100,ejec*100)}%;background:${cl}"></div>
        </div>
      </div>`;
    }).join('')}
    </div>
    <div class="alert ai" style="margin-top:16px;margin-bottom:0">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"/></svg>

    </div>
  </div>`;
}

    ${S.metas.length===0
      ? `<div style="text-align:center;padding:40px;color:var(--text3)">

const cop2 = n => isNaN(n)||!isFinite(n)?'—':'$'+new Intl.NumberFormat('es-CO').format(Math.round(n));
const pct2 = (n,d=2) => isNaN(n)?'—':(n*100).toFixed(d)+'%';

function toEA(r,t){switch(t){case'EA':return r;case'MV':return Math.pow(1+r,12)-1;case'ET':return Math.pow(1+r,4)-1;case'ES':return Math.pow(1+r,2)-1;case'NA':return Math.pow(1+r/12,12)-1;case'NM':return Math.pow(1+r,12)-1;default:return r;}}
function fromEA(ea,t){switch(t){case'EA':return ea;case'MV':return Math.pow(1+ea,1/12)-1;case'ET':return Math.pow(1+ea,1/4)-1;case'ES':return Math.pow(1+ea,1/2)-1;case'NA':return 12*(Math.pow(1+ea,1/12)-1);case'NM':return Math.pow(1+ea,1/12)-1;default:return ea;}}
const tLabel={EA:'Efectiva Anual',MV:'Efectiva Mensual',ET:'Efectiva Trimestral',ES:'Efectiva Semestral',NA:'Nominal Anual',NM:'Nominal Mensual'};

}

function calcCredito(){
  const mo=parseFloat(document.getElementById('c2-m').value)||0;
  const rm=parseFloat(document.getElementById('c2-t').value)/100;
  const n=parseFloat(document.getElementById('c2-p').value)||1;
  const conAd=document.getElementById('c2-yn').value==='si';
  const adMonto=parseFloat(document.getElementById('c2-a').value)||0;
  const kCuota=parseFloat(document.getElementById('c2-k').value)||1;
  const cuota=mo*rm*Math.pow(1+rm,n)/(Math.pow(1+rm,n)-1);
  const totalSin=cuota*n; const intSin=totalSin-mo;
  let html2='';
  if(conAd&&adMonto>0&&kCuota<n){
    let saldo=mo;
    for(let i=1;i<kCuota;i++){saldo-=(cuota-saldo*rm);}
    const saldoNuevo=Math.max(0,saldo-adMonto);
    const rest=n-kCuota;
    if(saldoNuevo>0&&rest>0){
      const nc=saldoNuevo*rm*Math.pow(1+rm,rest)/(Math.pow(1+rm,rest)-1);
      const totalCon=(kCuota-1)*cuota+adMonto+nc*rest;
      const intCon=totalCon-mo;
      const ahorradas=Math.round((intSin-intCon)/(cuota));
      html2=`<div class="rhigh" style="margin-top:10px">
        <div class="rrow"><span class="rl">Nueva cuota (con adelanto)</span><span class="rv" style="color:var(--accent2)">${cop2(nc)}/mes</span></div>
        <div class="rrow"><span class="rl">Total intereses CON adelanto</span><span class="rv" style="color:var(--accent2)">${cop2(intCon)}</span></div>
        <div class="rrow"><span class="rl">💰 Intereses ahorrados</span><span class="rv big">${cop2(intSin-intCon)}</span></div>
        <div class="rrow"><span class="rl">Cuotas ahorradas</span><span class="rv" style="color:var(--accent2)">≈${n-rest-kCuota+1} cuotas</span></div>
      </div>`;
    }
  }
  document.getElementById('c2-out').innerHTML=`
    <div class="stitle">📤 Resultados SIN adelanto</div>
    <div class="rbox">
      <div class="rrow"><span class="rl">Cuota fija mensual</span><span class="rv">${cop2(cuota)}/mes</span></div>
      <div class="rrow"><span class="rl">Total a pagar</span><span class="rv">${cop2(totalSin)}</span></div>
      <div class="rrow"><span class="rl">Total intereses</span><span class="rv" style="color:var(--red)">${cop2(intSin)} (${pct2(intSin/mo,1)})</span></div>
    </div>${html2}`;
}

function calcDeudas(){
  const pres=parseFloat(document.getElementById('d3-p').value)||0;
  const est=document.getElementById('d3-e').value;
  let deudas=[];
  for(let i=0;i<5;i++){
    const s=parseFloat(document.getElementById(`d3-s${i}`).value)||0;
    if(s>0) deudas.push({n:document.getElementById(`d3-n${i}`).value||`Deuda ${i+1}`,s,t:parseFloat(document.getElementById(`d3-t${i}`).value)/100,c:parseFloat(document.getElementById(`d3-c${i}`).value)||0});
  }
  if(!deudas.length) return;
  const sorted=est==='snowball'?[...deudas].sort((a,b)=>a.s-b.s):[...deudas].sort((a,b)=>b.t-a.t);
  const totalD=deudas.reduce((a,d)=>a+d.s,0);
  const minC=deudas.reduce((a,d)=>a+d.c,0);
  let cumAbono=pres;
  const orden=sorted.map((d,i)=>{const a=cumAbono;if(i>0)cumAbono+=d.c;return{...d,abono:a};});
  const intEst=(d,extra)=>{const r=Math.pow(1+d.t,1/12)-1;const p=d.c+extra;if(p<=r*d.s)return{m:999,i:d.s*d.t};const m=Math.ceil(Math.log(p/(p-d.s*r))/Math.log(1+r));return{m:isFinite(m)?m:999,i:Math.max(0,p*m-d.s)};};
  const snowInt=deudas.reduce((a,d,i)=>{const idx=sorted.findIndex(s=>s.n===d.n);return a+intEst(d,orden[idx]?.abono||0).i;},0);
  const avOrden=[...deudas].sort((a,b)=>b.t-a.t);let avA=pres;
  const avInt=avOrden.reduce((a,d,i)=>{const r=intEst(d,avA);if(i>0)avA+=d.c;return a+r.i;},0);
  const ahorro=Math.max(0,snowInt-avInt);
  document.getElementById('d3-out').innerHTML=`
    <div class="stitle">Orden recomendado — ${est==='snowball'?'Snowball':'Avalanche'}</div>
    <table class="tbl" style="margin-bottom:10px">
      <thead><tr><th>Prioridad</th><th>Deuda</th><th>Saldo</th><th>Abono adicional</th></tr></thead>
      <tbody>${orden.map((d,i)=>`<tr><td><span class="sem sb2">${i+1}°</span></td><td><strong>${d.n}</strong></td><td>${cop2(d.s)}</td><td style="color:var(--accent2)">${cop2(d.abono)}</td></tr>`).join('')}</tbody>
    </table>
    <div class="rhigh">
      <div class="rrow"><span class="rl">Intereses Snowball</span><span class="rv" style="color:var(--amber)">${cop2(snowInt)}</span></div>
      <div class="rrow"><span class="rl">Intereses Avalanche</span><span class="rv" style="color:var(--accent2)">${cop2(avInt)}</span></div>
      <div class="rrow"><span class="rl">💰 Ahorro eligiendo Avalanche</span><span class="rv big">${cop2(ahorro)}</span></div>
    </div>`;
}

function calcAhorro(){

}

  const ah=parseFloat(document.getElementById('l6-a').value)||0;
  const rEA=parseFloat(document.getElementById('l6-rend').value)/100;
  const inf=parseFloat(document.getElementById('l6-inf').value)/100;
  const anos=ret-edad; const anosRet=vida-ret;
  const m=anos*12; const mRet=anosRet*12;
  const rReal=(1+rEA)/(1+inf)-1;
  const rRealM=Math.pow(1+rReal,1/12)-1;
  const brecha=g-pen;
  const rRetM=-0.001;
  const cap=Math.abs(rRetM)>0.0001?brecha*(1-Math.pow(1+rRetM,-mRet))/rRetM:brecha*mRet;
  const VFah=ah*Math.pow(1+rRealM,m);
  const falta=Math.max(0,cap-VFah);
  const ams=rRealM>0?falta*rRealM/(Math.pow(1+rRealM,m)-1):falta/m;
  const amsSin=cap/m;
  document.getElementById('l6-out').innerHTML=`
    <div class="stitle">📤 Tu plan de retiro</div>
    <div class="rbox">
      <div class="rrow"><span class="rl">Años para acumular</span><span class="rv">${anos} años (${m} meses)</span></div>
      <div class="rrow"><span class="rl">Capital productivo necesario</span><span class="rv">${cop2(cap)}</span></div>
      <div class="rrow"><span class="rl">VF de ahorro actual</span><span class="rv">${cop2(VFah)}</span></div>
      <div class="rrow"><span class="rl">Falta acumular</span><span class="rv" style="color:var(--red)">${cop2(falta)}</span></div>
    </div>
    <div class="rhigh" style="margin-top:10px">
      <div class="rrow"><span class="rl">🎯 Ahorro mensual requerido</span><span class="rv big">${cop2(ams)}/mes</span></div>
      <div class="rrow"><span class="rl">Sin invertir necesitarías</span><span class="rv">${cop2(amsSin)}/mes</span></div>
      <div class="rrow"><span class="rl">💡 Ahorras por invertir bien</span><span class="rv" style="color:var(--accent2)">${cop2(amsSin-ams)}/mes</span></div>
      <div class="rrow"><span class="rl">Año estimado de retiro</span><span class="rv">${new Date().getFullYear()+anos}</span></div>
    </div>`;
}

function calcInversiones(){
  const mo=parseFloat(document.getElementById('r7-m').value)||0;
  const pl=parseFloat(document.getElementById('r7-p').value)||12;
  const inf=parseFloat(document.getElementById('r7-inf').value)/100;
  const infP=Math.pow(1+inf,pl/12)-1;
  const res=[0,1,2].map(i=>({
    n:document.getElementById(`r7-n${i}`).value,
    t:parseFloat(document.getElementById(`r7-t${i}`).value)/100,
    r:parseFloat(document.getElementById(`r7-r${i}`).value)/100,
    c:parseFloat(document.getElementById(`r7-c${i}`).value)/100,
    o:parseFloat(document.getElementById(`r7-o${i}`).value)||0,
  })).map(inv=>{
    const tp=Math.pow(1+inv.t,pl/12)-1;
    const br=mo*tp;
    const ret=br*inv.r; const com=mo*(Math.pow(1+inv.c,pl/12)-1);
    const net=br-ret-com-inv.o;
    const real=net-mo*infP;
    return{...inv,br,net,real,pReal:real/mo};
  });
  const best=res.reduce((b,r,i)=>r.pReal>res[b].pReal?i:b,0);
  const medals=['🥇','🥈','🥉'];
  const sorted=[...res].map((r,i)=>({...r,orig:i})).sort((a,b)=>b.pReal-a.pReal);
  document.getElementById('r7-out').innerHTML=`
    <table class="tbl">
      <thead><tr><th>Métrica</th>${res.map(r=>`<th>${r.n}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>Ganancia bruta</td>${res.map(r=>`<td>${cop2(r.br)}</td>`).join('')}</tr>
        <tr><td>Ganancia neta nominal</td>${res.map(r=>`<td><strong>${cop2(r.net)}</strong></td>`).join('')}</tr>
        <tr><td>Pérdida inflación</td>${res.map(r=>`<td style="color:var(--red)">${cop2(mo*infP)}</td>`).join('')}</tr>
        <tr><td style="color:var(--accent2);font-weight:600">🎯 Ganancia REAL</td>${res.map((r,i)=>`<td class="${i===best?'tg':''}" style="font-weight:600">${cop2(r.real)}</td>`).join('')}</tr>
        <tr><td>Rentabilidad REAL EA</td>${res.map((r,i)=>`<td class="${i===best?'tg':''}">${pct2(r.pReal)}</td>`).join('')}</tr>
        <tr><td>Ranking</td>${sorted.map((r,rank)=>`<td>${medals[rank]}</td>`).join('')}</tr>
      </tbody>
    </table>
    <div class="ai-nota" style="margin-top:10px">🏆 Mejor opción: <strong>${res[best].n}</strong> con ${pct2(res[best].pReal)} real EA | Ganancia real: ${cop2(res[best].real)}</div>`;
}

function calcVivienda(){
  const ing=parseFloat(document.getElementById('v8-ing').value)||0;
  const pctMax=parseFloat(document.getElementById('v8-pct').value)/100;
  const pctCI=parseFloat(document.getElementById('v8-ci').value)/100;
  const mCI=parseFloat(document.getElementById('v8-mc').value)||1;
  const teaHip=parseFloat(document.getElementById('v8-tea').value)/100;
  const anos=parseFloat(document.getElementById('v8-anos').value)||1;
  const valEA=parseFloat(document.getElementById('v8-val').value)/100;
  const ah=parseFloat(document.getElementById('v8-ah').value)||0;
  const rm=Math.pow(1+teaHip,1/12)-1;
  const n=anos*12;
  const pctSeg=0.08;
  const cuotaMax=ing*pctMax;
  const cuotaAmort=cuotaMax/(1+pctSeg);
  const pctFin=1-pctCI;
  const valorMax=cuotaAmort*(Math.pow(1+rm,n)-1)/(rm*Math.pow(1+rm,n));
  const valorMaxF=valorMax/pctFin;
  const ci=valorMaxF*pctCI;
  const ahorroCI=Math.max(0,(ci-ah)/mCI);
  const valFut=valorMaxF*Math.pow(1+valEA,anos);
  const totalD=ci+cuotaMax*n+valorMaxF*0.03;
  const ganancia=valFut-totalD;
  document.getElementById('v8-out').innerHTML=`
    <div class="stitle">📤 Resultados Modalidad A</div>
    <div class="rhigh">
      <div class="rrow"><span class="rl">🎯 VALOR MÁXIMO INMUEBLE</span><span class="rv big">${cop2(valorMaxF)}</span></div>
      <div class="rrow"><span class="rl">Crédito hipotecario</span><span class="rv">${cop2(valorMaxF*pctFin)}</span></div>
      <div class="rrow"><span class="rl">Cuota mensual banco</span><span class="rv">${cop2(cuotaMax)}/mes (${(pctMax*100).toFixed(0)}%)</span></div>
      <div class="rrow"><span class="rl">Cuota inicial (${(pctCI*100).toFixed(0)}%)</span><span class="rv">${cop2(ci)}</span></div>
      <div class="rrow"><span class="rl">Ahorro mensual cuota inicial</span><span class="rv">${cop2(ahorroCI)}/mes</span></div>
      <div class="rrow"><span class="rl">Gastos escrituración (3%)</span><span class="rv">${cop2(valorMaxF*0.03)}</span></div>
    </div>
    <div class="rbox" style="margin-top:10px">
      <div class="rrow"><span class="rl">📈 Valor inmueble en ${anos} años</span><span class="rv" style="color:var(--accent2)">${cop2(valFut)}</span></div>
      <div class="rrow"><span class="rl">Ganancia patrimonial neta</span><span class="rv" style="color:var(--accent2)">${cop2(ganancia)} (${pct2(ganancia/totalD,1)})</span></div>
    </div>`;
}

function exportCSV() {
  if(S.transactions.length===0){toast('No hay transacciones para exportar','e');return;}
  const headers = ['Fecha','Tipo','Categoría','Subcategoría','Monto','Método','Clase','Notas'];
  const rows = S.transactions.map(t=>[
    t.fecha, t.tipo, t.cat, t.sub||'', t.monto, t.metodo, t.clase, t.notas||''
  ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`finanzas_${new Date().toISOString().split('T')[0]}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast('✓ CSV exportado correctamente');
}
