<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinanSmart — Control Financiero Personal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D1117;
  --bg2: #161B22;
  --bg3: #1C2128;
  --bg4: #22272E;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #CDD9E5;
  --text2: #8B949E;
  --text3: #4D5566;
  --accent: #2DA44E;
  --accent2: #3FB950;
  --accent-dim: rgba(45,164,78,0.12);
  --blue: #388BFD;
  --blue-dim: rgba(56,139,253,0.12);
  --amber: #D29922;
  --amber-dim: rgba(210,153,34,0.12);
  --red: #F85149;
  --red-dim: rgba(248,81,73,0.12);
  --purple: #BC8CFF;
  --purple-dim: rgba(188,140,255,0.12);
  --teal: #39D353;
  --r: 8px;
  --r2: 12px;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* ── LAYOUT ── */
.shell{display:grid;grid-template-columns:56px 220px 1fr;grid-template-rows:100vh;height:100vh;overflow:hidden}

/* ── ICON RAIL ── */
.rail{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px;z-index:20}
.rail-logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;flex-shrink:0}
.rail-logo svg{width:18px;height:18px;fill:#fff}
.ri{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);transition:all .15s;position:relative}
.ri:hover{background:var(--bg3);color:var(--text2)}
.ri.active{background:var(--accent-dim);color:var(--accent2)}
.ri svg{width:17px;height:17px}
.ri .tooltip{position:absolute;left:44px;background:var(--bg4);border:1px solid var(--border2);color:var(--text);font-size:12px;padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:99}
.ri:hover .tooltip{opacity:1}
.rail-sep{width:24px;height:1px;background:var(--border);margin:6px 0}

/* ── SIDEBAR ── */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:16px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-head h2{font-size:13px;font-weight:600;color:var(--text);letter-spacing:.01em}
.sidebar-head p{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar-search{margin:10px 12px;position:relative}
.sidebar-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 10px 6px 30px;font-size:12px;color:var(--text);font-family:var(--font);outline:none}
.sidebar-search input:focus{border-color:var(--border2)}
.sidebar-search input::placeholder{color:var(--text3)}
.sidebar-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text3)}
.sidebar-body{flex:1;overflow-y:auto;padding:4px 0}
.sidebar-body::-webkit-scrollbar{width:4px}
.sidebar-body::-webkit-scrollbar-track{background:transparent}
.sidebar-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.nav-group{padding:12px 12px 4px}
.nav-group-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:6px;cursor:pointer;color:var(--text2);font-size:13px;transition:all .12s;margin:1px 4px;position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent2);font-weight:500}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-badge{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600}
.nb-green{background:var(--accent-dim);color:var(--accent2)}
.nb-amber{background:var(--amber-dim);color:var(--amber)}
.nb-red{background:var(--red-dim);color:var(--red)}
.nb-blue{background:var(--blue-dim);color:var(--blue)}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.user-chip{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer}
.user-chip:hover{background:var(--bg3)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-plan{font-size:10px;color:var(--text3)}

/* ── MAIN ── */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.topbar-left{display:flex;align-items:center;gap:12px}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px}
.breadcrumb span{color:var(--text3)}
.breadcrumb strong{color:var(--text);font-weight:500}
.period-pill{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--text2);cursor:pointer}
.period-pill svg{width:12px;height:12px}
.topbar-right{display:flex;align-items:center;gap:8px}
.tb-btn{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:12px;color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .12s}
.tb-btn:hover{border-color:var(--border2);color:var(--text)}
.tb-btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tb-btn-primary:hover{background:#2a9648;border-color:#2a9648}
.tb-btn svg{width:13px;height:13px}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:16px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .15s}
.kpi-card:hover{border-color:var(--border2)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi-card.c-green::before{background:var(--accent)}
.kpi-card.c-blue::before{background:var(--blue)}
.kpi-card.c-amber::before{background:var(--amber)}
.kpi-card.c-red::before{background:var(--red)}
.kpi-card.c-purple::before{background:var(--purple)}
.kpi-label{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.kpi-value{font-size:24px;font-weight:700;color:var(--text);font-family:var(--mono);letter-spacing:-.02em}
.kpi-delta{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:11px}
.kpi-delta.up{color:var(--accent2)}
.kpi-delta.down{color:var(--red)}
.kpi-delta.flat{color:var(--text3)}
.kpi-icon{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.kpi-icon svg{width:16px;height:16px}
.kpi-icon.i-green{background:var(--accent-dim);color:var(--accent2)}
.kpi-icon.i-blue{background:var(--blue-dim);color:var(--blue)}
.kpi-icon.i-amber{background:var(--amber-dim);color:var(--amber)}
.kpi-icon.i-red{background:var(--red-dim);color:var(--red)}

/* ── ROW LAYOUTS ── */
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.row-3{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-bottom:14px}
.row-4{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}

/* ── PANELS ── */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:18px}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel-title{font-size:13px;font-weight:600;color:var(--text)}
.panel-action{font-size:11px;color:var(--blue);cursor:pointer;opacity:.8}
.panel-action:hover{opacity:1}

/* ── CHART BARS ── */
.chart-area{height:120px;display:flex;align-items:flex-end;gap:5px}
.bar-group{display:flex;gap:2px;align-items:flex-end;flex:1}
.bar{border-radius:3px 3px 0 0;min-height:3px;transition:opacity .15s}
.bar:hover{opacity:.75}
.bar-ing{background:var(--accent)}
.bar-eg{background:var(--red)}
.bar-aho{background:var(--blue)}
.chart-labels{display:flex;gap:5px;margin-top:6px}
.chart-label{flex:1;font-size:9px;text-align:center;color:var(--text3)}
.chart-legend{display:flex;gap:14px;margin-top:10px}
.cl-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text3)}
.cl-dot{width:8px;height:8px;border-radius:2px}

/* ── DONUT ── */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-legend{display:flex;flex-direction:column;gap:8px;flex:1}
.dl-item{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.dl-bar-track{width:100%;height:4px;background:var(--bg3);border-radius:2px;margin-top:4px;overflow:hidden}
.dl-bar-fill{height:100%;border-radius:2px}

/* ── TABLE ── */
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid var(--border);text-align:left}
.data-table td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg3);color:var(--text)}
.td-bold{font-weight:600;color:var(--text)!important;font-family:var(--mono)}
.td-green{color:var(--accent2)!important;font-weight:600}
.td-red{color:var(--red)!important;font-weight:600}
.td-amber{color:var(--amber)!important;font-weight:600}

/* ── SEM ── */
.sem{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.sem-green{background:var(--accent-dim);color:var(--accent2)}
.sem-amber{background:var(--amber-dim);color:var(--amber)}
.sem-red{background:var(--red-dim);color:var(--red)}
.sem-dot{width:6px;height:6px;border-radius:50%}

/* ── PROGRESS ── */
.progress-track{width:100%;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;border-radius:3px;transition:width .5s}

/* ── FORM INPUTS ── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field label{font-size:11px;color:var(--text3);display:block;margin-bottom:4px}
.field input,.field select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .12s}
.field input:focus,.field select:focus{border-color:var(--blue)}
.field select option{background:var(--bg3)}

/* ── ALERT STRIP ── */
.alert{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:12px}
.alert-warn{background:var(--amber-dim);border:1px solid rgba(210,153,34,.25);color:#e3a21a}
.alert-info{background:var(--blue-dim);border:1px solid rgba(56,139,253,.25);color:var(--blue)}
.alert-success{background:var(--accent-dim);border:1px solid rgba(45,164,78,.25);color:var(--accent2)}
.alert svg{width:14px;height:14px;flex-shrink:0}

/* ── SECTION TITLE ── */
.section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;margin-top:4px}

/* ── CALC TABS ── */
.calc-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:8px;padding:3px;margin-bottom:16px;flex-wrap:wrap}
.calc-tab{padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text3);transition:all .12s;white-space:nowrap}
.calc-tab.active{background:var(--bg2);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.calc-tab:hover:not(.active){color:var(--text2)}

/* ── RESULT BOX ── */
.result-box{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:14px}
.result-highlight{background:linear-gradient(135deg,rgba(45,164,78,.1),rgba(56,139,253,.08));border:1px solid rgba(45,164,78,.2);border-radius:8px;padding:16px;margin-top:14px}
.res-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.res-row:last-child{border-bottom:none;margin-top:4px;padding-top:10px}
.res-label{font-size:12px;color:var(--text3)}
.res-value{font-size:13px;font-weight:600;color:var(--text);font-family:var(--mono)}
.res-value.big{font-size:20px;color:var(--accent2)}

/* ── GOAL CARDS ── */
.goal-list{display:flex;flex-direction:column;gap:10px}
.goal-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.goal-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.goal-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.goal-info{flex:1}
.goal-name{font-size:13px;font-weight:600;color:var(--text)}
.goal-meta{font-size:11px;color:var(--text3);margin-top:1px}
.goal-pct{font-size:14px;font-weight:700;font-family:var(--mono)}

/* ── SETUP TAGS ── */
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--text2);margin:3px;cursor:pointer;transition:all .12s}
.tag:hover{border-color:var(--border2);color:var(--text)}
.tag-active{background:var(--accent-dim);border-color:rgba(45,164,78,.3);color:var(--accent2)}
.tags-wrap{display:flex;flex-wrap:wrap;gap:2px}

/* ── PAGE SECTIONS ── */
.page{display:none}
.page.visible{display:block}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page.visible .kpi-card{animation:fadeIn .25s ease both}
.page.visible .kpi-card:nth-child(1){animation-delay:.03s}
.page.visible .kpi-card:nth-child(2){animation-delay:.06s}
.page.visible .kpi-card:nth-child(3){animation-delay:.09s}
.page.visible .kpi-card:nth-child(4){animation-delay:.12s}
.page.visible .panel{animation:fadeIn .3s ease both;animation-delay:.1s}

/* ── WATERMARK ── */
.watermark{position:fixed;bottom:14px;right:18px;font-size:10px;color:var(--text3);font-family:var(--mono);opacity:.4;pointer-events:none;z-index:100}
</style>
</head>
<body>
<div class="shell">

<!-- ── ICON RAIL ── -->
<div class="rail">
  <div class="rail-logo">
    <svg viewBox="0 0 20 20"><path d="M3 14h3v3H3v-3zm4-4h3v7H7v-7zm4-4h3v11h-3V6zm4-3h3v14h-3V3z"/></svg>

    <span class="tooltip">Presupuesto</span>

  <div class="ri" onclick="switchSection('registro',this)">

    <span class="tooltip">Configuración</span>
  </div>
</div>

<!-- ── SIDEBAR ── -->
<div class="sidebar">
  <div class="sidebar-head">
    <h2>FinanSmart</h2>
    <p>Control · Proyección · Simulación</p>
  </div>
  <div class="sidebar-search">
    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/></svg>
    <input type="text" placeholder="Buscar...">
  </div>
  <div class="sidebar-body" id="sidebar-nav">
    <!-- Rendered by JS -->
  </div>
  <div class="sidebar-foot">
    <div class="user-chip">
      <div class="avatar">YB</div>
      <div class="user-info">
        <div class="user-name">Yeti BI</div>
